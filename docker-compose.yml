version: '3.8'

services:
  shopping-cart-app:
    build: .
    container_name: shopping-cart-dev
    ports:
      - "4000:4000"
    volumes:
      # Mount the entire project directory for live updates
      - .:/app
      # Use a named volume for node_modules to avoid conflicts
      - node_modules:/app/node_modules
    working_dir: /app
    environment:
      - NODE_ENV=development
      - PORT=4000
    # Keep container running with interactive shell
    stdin_open: true
    tty: true

volumes:
  node_modules:
